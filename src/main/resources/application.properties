spring.application.name=demo
# loads .env from the working directory; real environment variables still win
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/trading}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
security.jwt.secret-key=${JWT_SECRET_KEY}
security.jwt.expiration-time=${JWT_EXPIRATION_MS:900000}
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.mvc.problemdetails.enabled=true
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
# pre-auth request bounds: bodies are small JSON, never forms
spring.jackson.factory.constraints.read.max-string-length=1024
spring.jackson.factory.constraints.read.max-document-length=65536
spring.mvc.formcontent.filter.enabled=false
server.tomcat.connection-timeout=10s
app.security.max-concurrent-password-hashes=${MAX_CONCURRENT_PASSWORD_HASHES:8}
# market number rules (see MarketProperties for the allowed ranges)
app.market.price-decimals=${MARKET_PRICE_DECIMALS:2}
app.market.quantity-decimals=${MARKET_QUANTITY_DECIMALS:8}
app.market.max-digits-before-dot=${MARKET_MAX_DIGITS_BEFORE_DOT:18}
# Kafka carries committed quotes to the live chart; off by default so no broker is needed
app.kafka.enabled=${KAFKA_ENABLED:false}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
# a down broker must not stall the price feed for Kafka's default 60 s
spring.kafka.producer.properties.max.block.ms=2000
# fake price feed (off unless SIMULATOR_ENABLED=true); start prices are used only when a market has no quote yet
app.simulator.enabled=${SIMULATOR_ENABLED:false}
app.simulator.seed=${SIMULATOR_SEED:42}
app.simulator.volatility=${SIMULATOR_VOLATILITY:0.0005}
app.simulator.start-prices.BTC-USDT=65000
app.simulator.start-prices.ETH-USDT=3000
# fills open limit orders every second; off in tests
app.matcher.enabled=${MATCHER_ENABLED:true}
# API docs (/v3/api-docs) and Swagger UI (/swagger-ui.html) are public; set both to false to switch them off
springdoc.api-docs.enabled=${API_DOCS_ENABLED:true}
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED:true}
