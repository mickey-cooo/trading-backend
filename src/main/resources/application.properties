spring.application.name=demo
# loads .env from the working directory; real environment variables still win
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/trading}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
security.jwt.secret-key=${JWT_SECRET_KEY}
security.jwt.expiration-time=${JWT_EXPIRATION_MS:900000}
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.mvc.problemdetails.enabled=true
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
# pre-auth request bounds: bodies are small JSON, never forms
spring.jackson.factory.constraints.read.max-string-length=1024
spring.jackson.factory.constraints.read.max-document-length=65536
spring.mvc.formcontent.filter.enabled=false
server.tomcat.connection-timeout=10s
app.security.max-concurrent-password-hashes=${MAX_CONCURRENT_PASSWORD_HASHES:8}
# market number rules (see MarketProperties for the allowed ranges)
app.market.price-decimals=${MARKET_PRICE_DECIMALS:2}
app.market.quantity-decimals=${MARKET_QUANTITY_DECIMALS:8}
app.market.max-digits-before-dot=${MARKET_MAX_DIGITS_BEFORE_DOT:18}
